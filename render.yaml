services:
  # Frontend Service (Next.js) - FREE TIER
  - type: web
    name: omnitrade-frontend
    env: node
    plan: free
    rootDir: omni-trade-ai/frontend_web
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_WS_URL
        description: "The WebSocket URL of the backend (e.g., wss://omnitrade-backend.onrender.com/ws/signals)"
        sync: false
      - key: NODE_OPTIONS
        value: "--max-old-space-size=450" # Help Next.js build stay within 512MB

  # Backend Service (FastAPI + Integrated Scraper) - FREE TIER
  - type: web
    name: omnitrade-backend
    env: python
    plan: free
    rootDir: omni-trade-ai/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.0
